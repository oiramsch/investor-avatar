services:
  backend:
    build: ./backend
    env_file: .env
    expose:
      - "8765"
    restart: unless-stopped
    networks:
      - ki-fabrik

  frontend:
    build: ./frontend
    ports:
      - "8766:8766"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ki-fabrik

networks:
  ki-fabrik:
    external: true
