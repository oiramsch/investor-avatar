server {
    listen 8766;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend:8765/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE streaming to D-ID's Custom-LLM endpoint MUST NOT be buffered or
        # the avatar stutters massively while nginx waits to fill a buffer
        # before forwarding. The backend also sends `X-Accel-Buffering: no`,
        # but we set it here too so any /api/ SSE response is safe.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
